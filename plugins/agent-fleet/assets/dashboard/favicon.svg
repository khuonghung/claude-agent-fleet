<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Agent Fleet">
  <defs>
    <linearGradient id="af-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232b3b"/>
      <stop offset="1" stop-color="#0e121a"/>
    </linearGradient>
    <linearGradient id="af-lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd56b"/>
      <stop offset="1" stop-color="#ee9f1f"/>
    </linearGradient>
    <!-- The two cuts that split the arrow into layers. -->
    <mask id="af-cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M14 33 L32 24 L50 33 M8 45 L32 33 L56 45" stroke="#000" stroke-width="2.6" fill="none"/>
    </mask>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#af-tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <!-- One arrow made of three layers: the lead at its tip, the members behind it, moving as one. -->
  <g mask="url(#af-cuts)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M17.6 40.2 L32 33 L46.4 40.2 L52 52 L32 42 L12 52 Z" fill="#8b96ab" stroke="#8b96ab"/>
    <path d="M23.3 28.4 L32 24 L40.7 28.4 L46.4 40.2 L32 33 L17.6 40.2 Z" fill="#dfe5f0" stroke="#dfe5f0"/>
    <path d="M32 10 L40.7 28.4 L32 24 L23.3 28.4 Z" fill="url(#af-lead)" stroke="url(#af-lead)"/>
  </g>
</svg>
